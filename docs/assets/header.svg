<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Thor Companion</title>
  <desc id="description">Your Thor, on your phone. An arrow points from a dual-screen Thor to a phone.</desc>
  <rect width="1200" height="280" rx="24" fill="#1D1825"/>

  <g aria-label="AYN Thor" transform="translate(0 20)">
    <rect x="48" y="44" width="152" height="152" rx="36" fill="#6B5C87"/>
    <g fill="none" stroke="#F5EFFB" stroke-width="6" stroke-linejoin="round">
      <rect x="83" y="72" width="82" height="55" rx="10"/>
      <rect x="83" y="140" width="82" height="29" rx="8"/>
    </g>
  </g>

  <text x="600" y="119" text-anchor="middle" fill="#F5EFFB" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-1.8">Thor Companion</text>
  <text x="600" y="165" text-anchor="middle" fill="#C5B9D3" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="28">Your Thor, on your phone.</text>

  <g fill="none" stroke="#C6B2E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="Thor to phone">
    <path d="M250 207 H994 M978 193 L994 207 L978 221"/>
    <rect x="1038" y="66" width="76" height="148" rx="17"/>
    <path d="M1064 81 H1088 M1068 198 H1084"/>
  </g>
</svg>
